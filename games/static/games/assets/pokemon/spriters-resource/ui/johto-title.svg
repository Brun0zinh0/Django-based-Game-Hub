<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 150" role="img" aria-label="Pokemon Johto League wordmark">
  <!-- Hand-authored HGSS-style gold wordmark: no clean 2D rip of the
       HeartGold/SoulSilver logo exists on the archives this project uses,
       so Johto's plate is drawn in the era's gold-on-navy treatment. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.45" stop-color="#f2c94c"/>
      <stop offset="0.55" stop-color="#c99a2e"/>
      <stop offset="1" stop-color="#8a6414"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c9d4de"/>
      <stop offset="1" stop-color="#8fa1b3"/>
    </linearGradient>
  </defs>
  <text x="230" y="62" text-anchor="middle"
        font-family="'Trebuchet MS', Arial, sans-serif" font-size="58" font-weight="900"
        fill="url(#gold)" stroke="#2b2410" stroke-width="3" paint-order="stroke"
        letter-spacing="2">JOHTO</text>
  <text x="230" y="112" text-anchor="middle"
        font-family="'Trebuchet MS', Arial, sans-serif" font-size="34" font-weight="900"
        fill="url(#silver)" stroke="#1d2733" stroke-width="2.4" paint-order="stroke"
        letter-spacing="9">LEAGUE</text>
  <text x="230" y="138" text-anchor="middle"
        font-family="'Trebuchet MS', Arial, sans-serif" font-size="14" font-weight="700"
        fill="#e9d18a" letter-spacing="4">HEARTGOLD ERA · GENERATION 2</text>
</svg>
